<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Crop Advisor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<!-- AgentX Chatbot Embed -->
<script defer>
  document.body.appendChild(document.createElement('div')).setAttribute('id','chatBubbleRoot');
  window.agx = '68c779c83e2b1f04a1ec6fe9h7PbFah7G17AFo1Lb192Xw==|kzS209oaRuRHFk4oktn72ySJbgnJ+Yi5TjTM0yvXUDs=';
</script>
<script defer src="https://storage.googleapis.com/agentx-cdn-01/agentx-chat.js"></script>

<body>
  <h1>🌾 Welcome, {{ farmer_name }}!</h1>
  <form method="POST">
    <label>Farmer Name:</label><input name="farmer_name" value="{{ farmer_name }}"><br>
    <label>Crop Type:</label>
    <select name="crop_type">
      <option>Wheat</option><option>Rice</option><option>Maize</option><option>Soybean</option>
    </select><br>
    <label>Rainfall (mm):</label><input type="number" name="rainfall" value="150"><br>
    <label>Temperature (°C):</label><input type="number" name="temperature" value="25"><br>
    <label>Days to Harvest:</label><input type="number" name="days_to_harvest" value="120"><br>
    <label>Fertilizer Used:</label><select name="fertilizer_used"><option value="0">No</option><option value="1">Yes</option></select><br>
    <label>Irrigation Used:</label><select name="irrigation_used"><option value="0">No</option><option value="1">Yes</option></select><br>
    <label>Nitrogen (kg/ha):</label><input type="number" name="nitrogen" value="80"><br>
    <label>Phosphorus (kg/ha):</label><input type="number" name="phosphorus" value="40"><br>
    <label>Potassium (kg/ha):</label><input type="number" name="potassium" value="30"><br>
    <label>Soil pH:</label><input type="number" step="0.1" name="soil_ph" value="6.5"><br>
    <label>Humidity (%):</label><input type="number" name="humidity" value="60"><br>
    <label>NDVI:</label><input type="number" step="0.1" name="ndvi" value="0.6"><br>
    <button type="submit">Predict Yield</button>
  </form>

  {% if prediction is not none %}
    <h2>🔍 Predicted Yield: {{ prediction | round(2) }} tons/ha</h2>
    <p>{{ irrigation_msg }}</p>
    <p>{{ pest_alert }}</p>
    <h3>🌿 Fertilizer Recommendations:</h3>
    <ul>
      {% for rec in fertilizer_advice %}
        <li>{{ rec }}</li>
      {% endfor %}
    </ul>
  {% endif %}
